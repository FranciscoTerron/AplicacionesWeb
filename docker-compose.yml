name: ma-piscinas

services:
  # PHP-FPM — Laravel
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    container_name: ma-piscinas-app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
    networks:
      - ma-piscinas-network

  # Nginx — Backend en localhost:8000
  nginx:
    image: nginx:alpine
    container_name: ma-piscinas-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ma-piscinas-network

networks:
  ma-piscinas-network:
    name: ma-piscinas-network
    driver: bridge
